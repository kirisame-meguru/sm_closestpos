name: build-and-release

# Builds the Linux 32-bit extension and, on a version tag (v*), publishes a
# GitHub Release with the .so attached. Upstream/eIIdot only upload CI artifacts
# and never cut a release, so there is no binary for people to download — this
# fixes that.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ 'LICENSE', 'README.md' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux 32-bit (SourceMod ${{ matrix.sm }})
    runs-on: ubuntu-22.04
    permissions:
      contents: write          # required so the release step can create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - sm: '1.12'
            sm_branch: '1.12-dev'
    steps:
      - name: Checkout sm_closestpos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install 32-bit toolchain + ambuild
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang g++-multilib gcc-multilib python3 python3-pip git zip
          git clone --depth 1 https://github.com/alliedmodders/ambuild
          pip3 install ./ambuild

      - name: Checkout SourceMod ${{ matrix.sm }}
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          path: sourcemod
          submodules: recursive

      - name: Checkout Metamod:Source ${{ matrix.sm }}
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ matrix.sm_branch }}
          path: mmsource
          submodules: recursive

      - name: Configure & build
        run: |
          mkdir build && cd build
          CC=clang CXX=clang++ python3 ../configure.py --enable-optimize \
            --sm-path="$GITHUB_WORKSPACE/sourcemod" \
            --mms-path="$GITHUB_WORKSPACE/mmsource"
          ambuild

      - name: Verify artifact is ELF 32-bit
        run: |
          SO=build/package/addons/sourcemod/extensions/closestpos.ext.so
          file "$SO"
          file -b "$SO" | grep -q 'ELF 32-bit.*Intel 80386'

      - name: Package zip
        run: |
          cd build/package
          zip -r "$GITHUB_WORKSPACE/sm_closestpos-sm${{ matrix.sm }}-linux-x86.zip" .

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm_closestpos-sm${{ matrix.sm }}-linux-x86
          path: build/package

      - name: Publish release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sm_closestpos-sm${{ matrix.sm }}-linux-x86.zip
            build/package/addons/sourcemod/extensions/closestpos.ext.so
          generate_release_notes: true
          body: |
            **Linux 32-bit build of sm_closestpos with the `RTLD_NOLOAD` fix.**

            Upstream's `SDK_OnLoad()` re-opens `sourcemod.logic.so` with `RTLD_NOW`
            purely to fetch a handle for `memutils->ResolveSymbol("g_pCoreIdent")`.
            `RTLD_NOW` forces re-resolution of all of logic.so's symbols, which fails
            on setups where SourceMod loaded it with locally-scoped symbols (observed:
            CS:S + SourceMod 1.12 on modern Linux -> "dlopen failed on logic.so").
            logic.so is always already loaded at this point, so `RTLD_NOLOAD` returns
            the existing handle with no re-resolution.

            Built against **SourceMod ${{ matrix.sm }}** (loads on 1.11/1.12+).
            Install: drop `closestpos.ext.so` into `addons/sourcemod/extensions/`.
